name: Anthro Energy
description: Anthro Energy is a battery materials company based in Alameda, California, developing
  next-generation electrolyte technology for lithium-ion and next-gen battery cells. Its flagship
  Proteus platform is a drop-in electrolyte that increases energy density, improves safety, and adds
  mechanical integrity without requiring changes to existing gigafactory manufacturing infrastructure,
  and is compatible with a wide range of anodes, separators, and cathodes. Spun out of research at
  Stanford, Anthro Energy is a portfolio company of Union Square Ventures and Ultratech Capital. It is
  a physical-materials company with no public API surface; this profile is maintained in the API
  Evangelist network for company and market discovery.
